<!doctype html>
<html lang="en" data-head-script-count="0" data-body-script-count="0">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="template" content="home" />
    <title>Very Simple Ajax</title>
    <script src="/example/index.ts" type="module" defer></script>
    <link rel="stylesheet" href="/example/index.css" />
  </head>
  <body>
    <div id="progress" hidden></div>

    <nav>
      <ul>
        <li>
          <a
            id="update-link"
            href="/example/permanent/other.html"
            data-ajax-merge="update"
          >
            Update
          </a>
        </li>
        <li>
          <a
            id="replace-link"
            href="/example/permanent/other.html"
            data-ajax-merge="replace"
          >
            Replace
          </a>
        </li>
      </ul>
    </nav>

    <textarea id="permanent" data-ajax-permanent>Permanent</textarea>

    <h1>Home</h1>
  </body>
</html>
