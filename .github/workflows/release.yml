name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org/

      - name: Install
        run: npm i

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          TAG=latest
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            TAG=$(echo "${{ github.ref_name }}" | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+-([a-zA-Z]+).*/\1/')
          fi
          npm publish --provenance --access public --tag "$TAG"

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
